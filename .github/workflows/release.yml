name: Release Binaries & Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (e.g. v0.1.1)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: quilr-connector
  GHCR_IMAGE: ghcr.io/quilrai/quilr-connector

jobs:
  prepare:
    name: Validate release tag and version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Validate package version matches the tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit("Release tag must be a stable version, such as v0.1.1")
          with open("Cargo.toml", "rb") as source:
              version = tomllib.load(source)["package"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match Cargo.toml version {version}")
          result = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/latest"],
              capture_output=True, text=True,
          )
          latest = True
          if result.returncode == 0:
              published_tag = json.loads(result.stdout)["tag_name"]
              latest = tuple(map(int, tag[1:].split("."))) >= tuple(map(int, published_tag.removeprefix("v").split(".")))
          elif "HTTP 404" not in result.stderr:
              raise SystemExit(result.stderr)
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\nsha={sha}\nlatest={str(latest).lower()}\n")
          PY

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} --bin ${{ env.BINARY_NAME }}

      - name: Package Unix archive (.tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" dist/
          tar -C dist -czf "dist/${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz" "${{ env.BINARY_NAME }}"
          rm "dist/${{ env.BINARY_NAME }}"
          cd dist
          shasum -a 256 "${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz" > "${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz.sha256"

      - name: Package Windows archive (.zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zipName = "${env:BINARY_NAME}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${env:BINARY_NAME}.exe" -DestinationPath "dist/$zipName"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$zipName").Hash.ToLower()
          "$hash  $zipName" | Out-File -Encoding ascii "dist/$zipName.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: dist/*

  docker:
    name: Build & Push Multi-Arch GHCR Image
    needs: [prepare, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download Linux release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: quilr-connector-*-unknown-linux-musl
          path: artifacts
          merge-multiple: true

      - name: Prepare verified binaries for the Docker image
        run: |
          cd artifacts
          sha256sum --check *.sha256
          mkdir -p ../dist/amd64 ../dist/arm64
          tar -xzf quilr-connector-x86_64-unknown-linux-musl.tar.gz -C ../dist/amd64
          tar -xzf quilr-connector-aarch64-unknown-linux-musl.tar.gz -C ../dist/arm64
          chmod +x ../dist/*/quilr-connector

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.latest == 'true' }}
            type=raw,value=sha-${{ needs.prepare.outputs.sha }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Publish GitHub Release
    needs: [prepare, build-binaries, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          # Docker also uploads a .dockerbuild record, which is not a binary archive.
          pattern: quilr-connector-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          make_latest: legacy
          fail_on_unmatched_files: true
          files: artifacts/*
